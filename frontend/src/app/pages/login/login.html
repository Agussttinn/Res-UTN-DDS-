<div class="flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-6">
    <div class="text-center">
      <span class="text-4xl">🎓</span>
      <h2 class="mt-3 text-2xl font-black text-slate-800">Ingresar a RES-UTN</h2>
      <p class="text-xs text-slate-500 mt-1">Accedé con tu legajo institucional para ponderar y compartir recursos</p>
    </div>

    @if (errorMensaje) {
      <div class="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg text-center">
        {{ errorMensaje }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Legajo / Usuario</label>
        <input type="text" [(ngModel)]="credenciales.username" name="username" required
               placeholder="Ej: 48123"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contraseña</label>
        <input type="password" [(ngModel)]="credenciales.password" name="password" required
               placeholder="••••••••"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" />
      </div>

      <button type="submit" [disabled]="cargando"
              class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-semibold py-2.5 rounded-lg text-sm shadow-sm transition-all">
        {{ cargando ? 'Iniciando sesión...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
