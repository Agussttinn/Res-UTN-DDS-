<div class="flex items-center justify-center py-10 px-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8 space-y-6">
    <div class="flex items-center gap-3">
      <app-logo [tamano]="40" />
      <div>
        <h2 class="text-2xl font-black text-slate-800">Recuperar contraseña</h2>
        <p class="text-xs text-slate-500 mt-1">Te mandamos un link a tu correo institucional</p>
      </div>
    </div>

    @if (enviado()) {
      <div role="status" class="p-3 bg-green-50 border border-green-200 text-green-800 text-xs rounded-lg">
        Si el legajo está registrado, te enviamos un mail con las instrucciones. El link vence en 30 minutos.
        Revisá también la carpeta de spam.
      </div>
    } @else {
      @if (error()) {
        <div role="alert" class="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg text-center">
          {{ error() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="legajo" class="block text-xs font-bold text-slate-700 uppercase mb-1">Legajo</label>
          <input id="legajo" type="text" [(ngModel)]="legajo" name="legajo" required autocomplete="username"
                 placeholder="Ej: 48123"
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-colors" />
        </div>

        <button type="submit" [disabled]="cargando()"
                class="w-full bg-brand-600 hover:bg-brand-700 disabled:bg-brand-300 text-white font-semibold py-2.5 rounded-lg text-sm shadow-sm transition-all">
          {{ cargando() ? 'Enviando...' : 'Enviar link' }}
        </button>
      </form>
    }

    <p class="text-center text-xs text-slate-500">
      <a routerLink="/login" class="font-semibold text-brand-700 hover:text-brand-800">Volver a iniciar sesión</a>
    </p>
  </div>
</div>
